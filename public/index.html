<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Valida Documentos ISP</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: Arial, Helvetica, sans-serif;
        color: #333;
        background: #fff;
    }

    .home-header {
        background: #fff;
        border-bottom: 1px solid #ddd;
    }

    .main-nav {
        padding: 0;
    }

    .container {
        width: 100%;
        max-width: 1140px;
        margin: 0 auto;
        padding: 0 20px;
    }

    .header-content {
        display: flex;
        align-items: center;
    }

    .logos {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .logo-isp {
        width: 150px;
        height: auto;
    }

    .logo-anios {
        width: 90px;
        height: auto;
    }

    main {
        flex: 1;
    }

    .main-container {
        margin-top: 40px;
        margin-bottom: 30px;
    }

    .jumbotron {
        padding: 40px 32px;
        background: #e9ecef;
        border-radius: 4px;
        text-align: left;
    }

    .jumbotron h1 {
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 2.5rem;
        font-weight: 400;
        color: #212529;
    }

    .lead {
        font-size: 20px;
        margin-bottom: 20px;
    }

    .search-form {
        margin-top: 20px;
    }

    .search-input {
        width: 450px;
        max-width: 100%;
        padding: 6px;
        font-size: 16px;
        border: 1px solid #999;
        border-radius: 2px;
    }

    .search-button {
        margin-top: 15px;
        padding: 6px 12px;
        font-size: 16px;
        border: 1px solid #999;
        border-radius: 3px;
        background: #eee;
        color: #333;
        cursor: pointer;
    }

    .search-button:hover {
        background: #ddd;
    }

    footer {
        border-top: 1px solid #ddd;
        margin-top: 60px;
        padding: 20px 0;
        color: #777;
        font-size: 14px;
    }

    footer a {
        color: #0066cc;
        text-decoration: none;
    }

    footer a:hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {

        .header-content {
            justify-content: center;
        }

        .logos {
            gap: 10px;
        }

        .logo-isp {
            width: 130px;
        }

        .logo-anios {
            width: 75px;
        }

        .jumbotron {
            padding: 30px 20px;
        }

        .jumbotron h1 {
            font-size: 28px;
        }

        .lead {
            font-size: 18px;
        }
    }
   hr {
    margin-top: 32px;
    margin-bottom: 15px;
    border: 0;
    border-top: 1px solid #ddd;
}

</style>

</head>


<body>


<header class="home-header">

    <nav class="main-nav">

        <div class="container">

            <div class="header-content">

                <div class="logos">

                    <a href="https://www.ispch.gob.cl/">

                        <img
                            class="logo-isp"
                            src="https://ispdocel.ispch.gob.cl/images/Logo-ISP3.0.png"
                            alt="Instituto de Salud Pública">

                    </a>

                    <a href="https://www.ispch.gob.cl/">

                        <img
                            class="logo-anios"
                            src="https://ispdocel.ispch.gob.cl/images/logo-anios.png"
                            alt="ISP">

                    </a>

                </div>

            </div>

        </div>

    </nav>

</header>


<main>

    <div class="container main-container">

        <div class="jumbotron">

            <h1>Verificar Documento ISP</h1>

            {{CONTENIDO}}

        </div>
<hr>
    </div>

</main>


<footer>

    <div class="container">


        <b>Contacto con OIRS: </b>

        <a
            href="http://www.ispch.cl/oirs/"
            target="_blank">

            Oficina de Informaciones,
            Reclamos y Sugerencias

        </a>

    </div>

</footer>

</html>
